name: Release and Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-server:
    name: 检查服务器
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

  check-modules:
    name: 检查模块
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

  check-desktop:
    name: 检查桌面（类型检查 + 模块）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.2.0
        with:
          node-version: 20

  frontend:
    name: 前端（类型检查+构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.2.0
        with:
          node-version: 20

  build-server:
    name: 构建服务器（Linux）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.2.0
        with:
          node-version: 20

  build-desktop:
    name: 构建桌面（Linux）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.2.0
        with:
          node-version: 20

  auto-release:
    name: 自动标签发布
    runs-on: ubuntu-latest
    needs: [build-server, build-desktop]
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true

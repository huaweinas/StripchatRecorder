name: Sync Upstream & Tags

on:
  schedule:
    - cron: '0 0 * * *'  # 每天北京时间早 8:00 自动检查
  workflow_dispatch:      # 支持手动一键触发

permissions:
  contents: write

jobs:
  sync:
    name: Sync Branch & Tags
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream branch and tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. 添加 upstream 远程仓库
          git remote add upstream https://github.com/ChanTrail/StripchatRecorder.git || true
          git fetch upstream --tags

          # 2. 自动检测 upstream 的默认主分支（main 或 master）
          UPSTREAM_BRANCH=$(git remote show upstream | grep 'HEAD branch' | cut -d' ' -f5)
          echo "Upstream main branch is $UPSTREAM_BRANCH"

          # 3. 强制将本地分支与 upstream 同步
          git checkout -B $UPSTREAM_BRANCH upstream/$UPSTREAM_BRANCH

          # 4. 推送分支和 Tags 到你的 GitHub 仓库
          git push origin $UPSTREAM_BRANCH --force
          git push origin --tags --force

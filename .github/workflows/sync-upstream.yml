name: Sync Upstream & Tags

on:
  schedule:
    - cron: '0 0 * * *'  # 每天北京时间早 8:00 自动检查同步
  workflow_dispatch:      # 支持在 Actions 页面手动点击一键同步

permissions:
  contents: write

jobs:
  sync:
    name: Sync Branch & Tags
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream branch and tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. 添加 upstream 远程仓库并拉取最新代码和 Tags
          git remote add upstream https://github.com/ChanTrail/StripchatRecorder.git || true
          git fetch upstream --tags

          # 2. 强行将你的 master 分支重置为原作者的 master 分支
          git checkout master
          git reset --hard upstream/master

          # 3. 强行将更新后的 master 分支和 Tags 推送到你的 GitHub 仓库
          git push origin master --force
          git push origin --tags --force
